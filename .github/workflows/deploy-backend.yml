name: Backend — tests et paquet de déploiement

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**' ]
  workflow_dispatch:

jobs:
  paquet:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Installer les dépendances (production)
      run: npm ci
      working-directory: backend

    - name: Tests
      run: npm test
      working-directory: backend

    - name: Créer le paquet de déploiement
      run: |
        npm prune --omit=dev
        tar --exclude=./tests -czf ../backend-deployment.tar.gz .
      working-directory: backend

    - name: Publier l'artefact
      uses: actions/upload-artifact@v4
      with:
        name: backend
        path: backend-deployment.tar.gz
