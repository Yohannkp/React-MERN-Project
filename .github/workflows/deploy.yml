name: Tests et déploiement

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Installer les dépendances du backend
      run: npm ci
      working-directory: backend

    - name: Tests de sécurité de l'API (401 sans jeton, 403 si pas l'auteur)
      run: npm test
      working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Installer les dépendances du frontend
      run: npm ci
      working-directory: frontend

    - name: Tests du frontend
      run: npm test -- --watchAll=false
      working-directory: frontend

    - name: Build de production
      run: npm run build
      working-directory: frontend

  deploy-frontend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Le jeton par défaut est en lecture seule : la publication pousse sur la branche gh-pages.
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Installer et construire le frontend
      run: |
        npm ci
        npm run build
      working-directory: frontend

    - name: Publier sur GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend/build
